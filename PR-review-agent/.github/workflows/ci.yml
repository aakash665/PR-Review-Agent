name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # Keep linting, static typing, and test coverage as separate CI gates.
      - run: ruff check app tests evaluation
      - run: mypy app
      - run: pytest --cov=app --cov=evaluation --cov-report=term-missing
