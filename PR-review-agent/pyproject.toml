[build-system]
# Use setuptools package discovery for the application and evaluator.
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-pr-review-agent"
version = "0.1.0"
description = "Evidence-grounded GitHub pull request reviews using repository RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyJWT>=2.8",
    "qdrant-client>=1.15,<2",
    "ruff>=0.4",
    "bandit>=1.7",
    "tree-sitter>=0.22",
    "tree-sitter-language-pack>=0.7",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]

[tool.setuptools.package-data]
"app.analysis" = ["semgrep_rules.yml"]

[tool.pytest.ini_options]
# Keep automated tests isolated from fixture-project tests.
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
